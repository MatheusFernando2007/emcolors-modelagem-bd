<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMColors — mapa do banco de dados</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F4F5F7;--pn:#fff;--ink:#151922;--mut:#566073;--ln:#DADFE7;--m:#C81E66;--ms:#FBE3ED;--c:#0A86B5;--cs:#DDF1F9;--y:#B88300;--ys:#FAEFCB;--k:#3E4658;--ks:#E6E9EF;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1117;--pn:#171B24;--ink:#E8EBF1;--mut:#9AA3B5;--ln:#2A3140;--m:#FF6FA6;--ms:#3A1627;--c:#4CC3F0;--cs:#10303D;--y:#F2C230;--ys:#3A2F0E;--k:#A9B3C7;--ks:#262C3A;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0E1117;--pn:#171B24;--ink:#E8EBF1;--mut:#9AA3B5;--ln:#2A3140;--m:#FF6FA6;--ms:#3A1627;--c:#4CC3F0;--cs:#10303D;--y:#F2C230;--ys:#3A2F0E;--k:#A9B3C7;--ks:#262C3A;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
code,pre,svg text{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}code{font-size:.86em}
a{color:var(--c)}
.g-m{--a:var(--m);--as:var(--ms)}.g-k{--a:var(--k);--as:var(--ks)}.g-y{--a:var(--y);--as:var(--ys)}.g-c{--a:var(--c);--as:var(--cs)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
nav{background:var(--pn);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto}
nav .brand{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;padding:0 10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
nav .brand small{flex-basis:100%;font-weight:400;font-size:.8rem;color:var(--mut);margin-top:-8px;letter-spacing:0}
.reg{display:grid;grid-template-columns:repeat(2,9px);gap:3px}.reg i{width:9px;height:9px;border-radius:50%}
nav h3{font-size:.8rem;font-weight:600;color:var(--mut);margin:14px 10px 4px}
nav .l{display:flex;flex-direction:column}
nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:inherit;text-decoration:none}
nav a:hover{background:var(--ks)}nav a[aria-current]{background:var(--as,var(--ks));font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--a);flex:none;display:inline-block}
nav .n{margin-left:auto;color:var(--mut);font-size:.8rem;font-weight:400}
main{padding:28px clamp(16px,4vw,48px) 64px;max-width:1240px;outline:0}
h1{font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.1;letter-spacing:-.025em;font-weight:800;margin:0 0 8px}
h2{font-size:1.1rem;margin:30px 0 10px;font-weight:600}
.lead{font-size:1.08rem;max-width:68ch;margin:0 0 6px}
ul,ol{padding-left:1.2em;max-width:76ch}li{margin:5px 0}
.th{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-left:6px solid var(--a);padding-left:14px;margin-bottom:12px}
.th h1{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:clamp(1.4rem,3vw,2rem);letter-spacing:-.03em}
.tag{background:var(--as);padding:1px 10px;border-radius:99px;font-size:.82rem;font-weight:600}.cnt{color:var(--mut);font-size:.88rem}
.sc{overflow-x:auto;background:var(--pn);border:1px solid var(--ln);border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 12px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{font-size:.82rem;color:var(--mut);font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}
.grid td{white-space:nowrap}.cols td:last-child{min-width:260px}
.mk{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--ks);margin:0 4px 3px 0;white-space:nowrap;color:var(--ink);text-decoration:none}
.pk{background:var(--ys)}.fk{background:var(--cs)}
.nl,.lb{color:var(--mut)}.lb{font-size:.86em}
.st{padding:1px 9px;border-radius:99px;font-size:.8rem;background:var(--ks)}.s-aprovado{background:var(--ys)}.s-em_producao{background:var(--ms)}.s-pronto,.s-entregue{background:var(--cs)}
.links{display:flex;flex-wrap:wrap;gap:8px}.links a{background:var(--pn);border:1px solid var(--ln);padding:3px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--a,var(--c))}
.map{overflow-x:auto;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px;margin-top:14px}
.map svg{min-width:880px;width:100%;height:auto;display:block}
.bx{cursor:pointer}.bx .f{fill:var(--pn)}.bx .h{fill:var(--as)}.bx .b{fill:none;stroke:var(--a);stroke-width:1.5}
.bx:hover .b,.bx:focus-visible .b{stroke-width:3.5}.bx:focus{outline:0}
.bx text{font-size:11px;fill:var(--ink)}.bx .t{font-weight:600;font-size:13px}.bx .ty{fill:var(--mut);font-size:9.5px;text-anchor:end}
.ln{fill:none;stroke:var(--mut);stroke-width:1.4;opacity:.7}.ln.hl{stroke:var(--ink);stroke-width:2.4;opacity:1}
svg[data-hot] .ln:not(.hl){opacity:.15}.q{font-size:11px;fill:var(--mut);text-anchor:middle;font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 0;color:var(--mut);font-size:.9rem}.leg span{display:flex;align-items:center;gap:6px}
.flow{list-style:none;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:none}
.flow li{background:var(--pn);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:8px;padding:10px;margin:0;font-size:.88rem}
.flow b{display:block;font-family:"JetBrains Mono",monospace;font-size:.86rem}.flow p{margin:4px 0 8px;color:var(--mut)}
.chip{display:inline-block;background:var(--ks);padding:0 8px;border-radius:99px;margin:0 4px 4px 0;text-decoration:none;color:var(--ink);font-size:.82rem}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:.95rem;font-family:"JetBrains Mono",monospace;font-weight:600;overflow-wrap:anywhere}.card p{margin:4px 0 8px;max-width:76ch}.when{color:var(--mut);font-size:.88rem}
.note{background:var(--cs);border-radius:8px;padding:10px 14px;max-width:76ch}
details{margin-top:8px}summary{cursor:pointer;color:var(--c);font-size:.9rem}pre{background:var(--bg);border-radius:8px;padding:12px;overflow-x:auto;font-size:.8rem;margin:8px 0 0}
a:focus-visible,summary:focus-visible{outline:2px solid var(--c);outline-offset:2px}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln)}nav .l{flex-direction:row;flex-wrap:wrap;gap:4px}nav .n{display:none}.flow{grid-template-columns:1fr}}
</style>
</head>

const DB={"t":{"cliente":{"cols":[{"n":"id_cliente","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"nome","t":"TEXT","nn":true,"pk":false,"u":false},{"n":"telefone","t":"TEXT","nn":true,"pk":false,"u":false}],"fks":[],"rows":[[1,"João Silva","(11) 90000-0001"],[2,"Maria Oliveira","(11) 90000-0002"],[3,"Padaria Pão Quente Ltda","(11) 90000-0003"],[4,"Studio Bella Estética","(11) 90000-0004"],[5,"Roberto Lima","(11) 90000-0005"],[6,"Ana Paula Costa","(11) 90000-0006"]]},"funcionario":{"cols":[{"n":"id_funcionario","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"nome","t":"TEXT","nn":true,"pk":false,"u":false},{"n":"cargo","t":"TEXT","nn":true,"pk":false,"u":false}],"fks":[],"rows":[[1,"Marcos Almeida","Gerente"],[2,"Patrícia Nogueira","Administrativo"],[3,"Renata Souza","Administrativo"],[4,"Carlos Souza","Operador de máquina"],[5,"Fábio Ramos","Operador de máquina"],[6,"Eduardo Pires","Expedicionista"]]},"fornecedor":{"cols":[{"n":"id_fornecedor","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"nome","t":"TEXT","nn":true,"pk":false,"u":false},{"n":"telefone","t":"TEXT","nn":true,"pk":false,"u":false}],"fks":[],"rows":[[1,"Tintas Paulista Ltda","(11) 3000-0001"],[2,"Papéis e Bobinas XYZ","(11) 3000-0002"],[3,"Clichês Rápido","(11) 3000-0003"]]},"tipo_produto":{"cols":[{"n":"id_tipo_produto","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"nome","t":"TEXT","nn":true,"pk":false,"u":true}],"fks":[],"rows":[[1,"Adesivo"],[2,"Cartão"],[3,"Etiqueta"]]},"produto":{"cols":[{"n":"id_produto","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"nome","t":"TEXT","nn":true,"pk":false,"u":true},{"n":"id_tipo_produto","t":"INTEGER","nn":true,"pk":false,"u":false}],"fks":[{"f":"id_tipo_produto","t":"tipo_produto","to":"id_tipo_produto"}],"rows":[[1,"Adesivo couché",1],[2,"Adesivo contracolado",1],[3,"Cartão de visita",2],[4,"Etiqueta couché",3],[5,"Etiqueta contracolado",3]]},"insumo":{"cols":[{"n":"id_insumo","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"nome","t":"TEXT","nn":true,"pk":false,"u":true},{"n":"quantidade_estoque","t":"NUMERIC(12,2)","nn":true,"pk":false,"u":false},{"n":"id_fornecedor","t":"INTEGER","nn":true,"pk":false,"u":false}],"fks":[{"f":"id_fornecedor","t":"fornecedor","to":"id_fornecedor"}],"rows":[[1,"Tinta CMYK",50,1],[2,"Bobina de papel couché",3000,2],[3,"Bobina de papel contracolado",2000,2],[4,"Clichê padrão",12,3]]},"pedido":{"cols":[{"n":"id_pedido","t":"INTEGER","nn":false,"pk":true,"u":false},{"n":"data_pedido","t":"TEXT","nn":true,"pk":false,"u":false},{"n":"forma_entrega","t":"TEXT","nn":true,"pk":false,"u":false},{"n":"status","t":"TEXT","nn":true,"pk":false,"u":false},{"n":"valor_total","t":"NUMERIC(12,2)","nn":false,"pk":false,"u":false},{"n":"id_cliente","t":"INTEGER","nn":true,"pk":false,"u":false},{"n":"id_funcionario_gerente_vendedor","t":"INTEGER","nn":true,"pk":false,"u":false},{"n":"id_funcionario_aprovador","t":"INTEGER","nn":false,"pk":false,"u":false}],"fks":[{"f":"id_funcionario_aprovador","t":"funcionario","to":"id_funcionario"},{"f":"id_funcionario_gerente_vendedor","t":"funcionario","to":"id_funcionario"},{"f":"id_cliente","t":"cliente","to":"id_cliente"}],"rows":[[1,"2026-10-05","entrega","entregue",1250,1,2,1],[2,"2026-10-14","retirada","pronto",3400,3,3,1],[3,"2026-10-22","retirada","em_producao",780,2,2,1],[4,"2026-10-27","entrega","aprovado",2150,4,3,1],[5,"2026-10-28","retirada","orcamento",null,5,2,null],[6,"2026-10-29","entrega","orcamento",null,1,3,null]]},"pedido_produto":{"cols":[{"n":"id_pedido","t":"INTEGER","nn":true,"pk":true,"u":false},{"n":"id_produto","t":"INTEGER","nn":true,"pk":true,"u":false},{"n":"quantidade_produto","t":"NUMERIC(10,2)","nn":true,"pk":false,"u":false}],"fks":[{"f":"id_produto","t":"produto","to":"id_produto"},{"f":"id_pedido","t":"pedido","to":"id_pedido"}],"rows":[[1,1,500],[1,3,1000],[2,4,2000],[3,3,500],[4,5,1500],[4,2,300],[5,3,2000],[6,4,800]]},"produto_insumo":{"cols":[{"n":"id_produto","t":"INTEGER","nn":true,"pk":true,"u":false},{"n":"id_insumo","t":"INTEGER","nn":true,"pk":true,"u":false}],"fks":[{"f":"id_insumo","t":"insumo","to":"id_insumo"},{"f":"id_produto","t":"produto","to":"id_produto"}],"rows":[[1,1],[1,2],[1,4],[2,1],[2,3],[2,4],[3,1],[3,2],[3,4],[4,1],[4,2],[4,4],[5,1],[5,3],[5,4]]}},"v":[{"name":"vw_estoque_do_pedido","sql":"CREATE VIEW vw_estoque_do_pedido AS\nSELECT DISTINCT\n       pp.id_pedido,\n       p.status,\n       i.nome AS insumo,\n       f.nome AS fornecedor,\n       i.quantidade_estoque,\n       CASE WHEN i.quantidade_estoque > 0 THEN 'OK' ELSE 'SEM ESTOQUE' END AS situacao\nFROM pedido_produto pp\nJOIN pedido         p  ON p.id_pedido     = pp.id_pedido\nJOIN produto_insumo li ON li.id_produto   = pp.id_produto\nJOIN insumo         i  ON i.id_insumo     = li.id_insumo\nJOIN fornecedor     f  ON f.id_fornecedor = i.id_fornecedor","cols":["id_pedido","status","insumo","fornecedor","quantidade_estoque","situacao"],"rows":[[1,"entregue","Tinta CMYK","Tintas Paulista Ltda",50,"OK"],[1,"entregue","Bobina de papel couché","Papéis e Bobinas XYZ",3000,"OK"],[1,"entregue","Clichê padrão","Clichês Rápido",12,"OK"],[4,"aprovado","Tinta CMYK","Tintas Paulista Ltda",50,"OK"],[4,"aprovado","Bobina de papel contracolado","Papéis e Bobinas XYZ",2000,"OK"],[4,"aprovado","Clichê padrão","Clichês Rápido",12,"OK"],[3,"em_producao","Tinta CMYK","Tintas Paulista Ltda",50,"OK"],[5,"orcamento","Tinta CMYK","Tintas Paulista Ltda",50,"OK"],[3,"em_producao","Bobina de papel couché","Papéis e Bobinas XYZ",3000,"OK"],[5,"orcamento","Bobina de papel couché","Papéis e Bobinas XYZ",3000,"OK"],[3,"em_producao","Clichê padrão","Clichês Rápido",12,"OK"],[5,"orcamento","Clichê padrão","Clichês Rápido",12,"OK"],[2,"pronto","Tinta CMYK","Tintas Paulista Ltda",50,"OK"],[6,"orcamento","Tinta CMYK","Tintas Paulista Ltda",50,"OK"],[2,"pronto","Bobina de papel couché","Papéis e Bobinas XYZ",3000,"OK"],[6,"orcamento","Bobina de papel couché","Papéis e Bobinas XYZ",3000,"OK"],[2,"pronto","Clichê padrão","Clichês Rápido",12,"OK"],[6,"orcamento","Clichê padrão","Clichês Rápido",12,"OK"]]},{"name":"vw_itens_pedido","sql":"CREATE VIEW vw_itens_pedido AS\nSELECT pp.id_pedido,\n       c.nome  AS cliente,\n       p.status,\n       tp.nome AS tipo,\n       pr.nome AS produto,\n       pp.quantidade_produto\nFROM pedido_produto pp\nJOIN pedido       p  ON p.id_pedido        = pp.id_pedido\nJOIN cliente      c  ON c.id_cliente       = p.id_cliente\nJOIN produto      pr ON pr.id_produto      = pp.id_produto\nJOIN tipo_produto tp ON tp.id_tipo_produto = pr.id_tipo_produto","cols":["id_pedido","cliente","status","tipo","produto","quantidade_produto"],"rows":[[1,"João Silva","entregue","Adesivo","Adesivo couché",500],[1,"João Silva","entregue","Cartão","Cartão de visita",1000],[2,"Padaria Pão Quente Ltda","pronto","Etiqueta","Etiqueta couché",2000],[3,"Maria Oliveira","em_producao","Cartão","Cartão de visita",500],[4,"Studio Bella Estética","aprovado","Etiqueta","Etiqueta contracolado",1500],[4,"Studio Bella Estética","aprovado","Adesivo","Adesivo contracolado",300],[5,"Roberto Lima","orcamento","Cartão","Cartão de visita",2000],[6,"João Silva","orcamento","Etiqueta","Etiqueta couché",800]]},{"name":"vw_pedidos","sql":"CREATE VIEW vw_pedidos AS\nSELECT p.id_pedido,\n       p.data_pedido,\n       p.status,\n       p.forma_entrega,\n       p.valor_total,\n       c.nome     AS cliente,\n       c.telefone AS telefone_cliente,\n       gv.nome    AS gerente_vendedor,\n       ap.nome    AS aprovador\nFROM pedido p\nJOIN cliente     c  ON c.id_cliente      = p.id_cliente\nJOIN funcionario gv ON gv.id_funcionario = p.id_funcionario_gerente_vendedor\nLEFT JOIN funcionario ap ON ap.id_funcionario = p.id_funcionario_aprovador","cols":["id_pedido","data_pedido","status","forma_entrega","valor_total","cliente","telefone_cliente","gerente_vendedor","aprovador"],"rows":[[1,"2026-10-05","entregue","entrega",1250,"João Silva","(11) 90000-0001","Patrícia Nogueira","Marcos Almeida"],[2,"2026-10-14","pronto","retirada",3400,"Padaria Pão Quente Ltda","(11) 90000-0003","Renata Souza","Marcos Almeida"],[3,"2026-10-22","em_producao","retirada",780,"Maria Oliveira","(11) 90000-0002","Patrícia Nogueira","Marcos Almeida"],[4,"2026-10-27","aprovado","entrega",2150,"Studio Bella Estética","(11) 90000-0004","Renata Souza","Marcos Almeida"],[5,"2026-10-28","orcamento","retirada",null,"Roberto Lima","(11) 90000-0005","Patrícia Nogueira",null],[6,"2026-10-29","orcamento","entrega",null,"João Silva","(11) 90000-0001","Renata Souza",null]]},{"name":"vw_pendencias","sql":"CREATE VIEW vw_pendencias AS\nSELECT 'Produto sem insumo' AS problema, nome AS registro\n  FROM produto WHERE id_produto NOT IN (SELECT id_produto FROM produto_insumo)\nUNION ALL\nSELECT 'Fornecedor sem insumo', nome\n  FROM fornecedor WHERE id_fornecedor NOT IN (SELECT id_fornecedor FROM insumo)\nUNION ALL\nSELECT 'Pedido sem item', 'Pedido #' || id_pedido\n  FROM pedido WHERE id_pedido NOT IN (SELECT id_pedido FROM pedido_produto)","cols":["problema","registro"],"rows":[]}],"tr":[{"name":"trg_itens_so_em_orcamento_delete","sql":"CREATE TRIGGER trg_itens_so_em_orcamento_delete\nBEFORE DELETE ON pedido_produto\nFOR EACH ROW\nWHEN (SELECT status FROM pedido WHERE id_pedido = OLD.id_pedido) <> 'orcamento'\nBEGIN\n  SELECT RAISE(ABORT, 'Os itens só podem mudar enquanto o pedido está em orçamento');\nEND"},{"name":"trg_itens_so_em_orcamento_insert","sql":"CREATE TRIGGER trg_itens_so_em_orcamento_insert\nBEFORE INSERT ON pedido_produto\nFOR EACH ROW\nWHEN (SELECT status FROM pedido WHERE id_pedido = NEW.id_pedido) <> 'orcamento'\nBEGIN\n  SELECT RAISE(ABORT, 'Os itens só podem mudar enquanto o pedido está em orçamento');\nEND"},{"name":"trg_itens_so_em_orcamento_update","sql":"CREATE TRIGGER trg_itens_so_em_orcamento_update\nBEFORE UPDATE ON pedido_produto\nFOR EACH ROW\nWHEN (SELECT status FROM pedido WHERE id_pedido = OLD.id_pedido) <> 'orcamento'\n  OR (SELECT status FROM pedido WHERE id_pedido = NEW.id_pedido) <> 'orcamento'\nBEGIN\n  SELECT RAISE(ABORT, 'Os itens só podem mudar enquanto o pedido está em orçamento');\nEND"},{"name":"trg_pedido_aprovar","sql":"CREATE TRIGGER trg_pedido_aprovar\nBEFORE UPDATE OF status ON pedido\nFOR EACH ROW\nWHEN OLD.status = 'orcamento' AND NEW.status = 'aprovado'\nBEGIN\n  SELECT RAISE(ABORT, 'Pedido sem itens: inclua pelo menos 1 produto antes de aprovar')\n  WHERE NOT EXISTS (SELECT 1 FROM pedido_produto WHERE id_pedido = NEW.id_pedido);\n\n  SELECT RAISE(ABORT, 'Há produto sem insumo cadastrado em produto_insumo: não dá para conferir o estoque')\n  WHERE EXISTS (SELECT 1\n                FROM pedido_produto pp\n                WHERE pp.id_pedido = NEW.id_pedido\n                  AND NOT EXISTS (SELECT 1 FROM produto_insumo li WHERE li.id_produto = pp.id_produto));\n\n  SELECT RAISE(ABORT, 'Estoque zerado: algum insumo deste pedido está sem saldo (veja vw_estoque_do_pedido)')\n  WHERE EXISTS (SELECT 1\n                FROM pedido_produto pp\n                JOIN produto_insumo li ON li.id_produto = pp.id_produto\n                JOIN insumo i          ON i.id_insumo   = li.id_insumo\n                WHERE pp.id_pedido = NEW.id_pedido\n                  AND i.quantidade_estoque <= 0);\nEND"},{"name":"trg_pedido_fluxo_status","sql":"CREATE TRIGGER trg_pedido_fluxo_status\nBEFORE UPDATE OF status ON pedido\nFOR EACH ROW\nWHEN NEW.status <> OLD.status\nBEGIN\n  SELECT RAISE(ABORT, 'Fluxo inválido: orcamento > aprovado > em_producao > pronto > entregue (uma etapa por vez, sem voltar)')\n  WHERE NOT (   (OLD.status = 'orcamento'   AND NEW.status = 'aprovado')\n             OR (OLD.status = 'aprovado'    AND NEW.status = 'em_producao')\n             OR (OLD.status = 'em_producao' AND NEW.status = 'pronto')\n             OR (OLD.status = 'pronto'      AND NEW.status = 'entregue'));\nEND"},{"name":"trg_pedido_nasce_orcamento","sql":"CREATE TRIGGER trg_pedido_nasce_orcamento\nBEFORE INSERT ON pedido\nFOR EACH ROW\nWHEN NEW.status <> 'orcamento'\nBEGIN\n  SELECT RAISE(ABORT, 'Todo pedido nasce como orcamento: avance o status depois, uma etapa por vez');\nEND"},{"name":"trg_pedido_so_apaga_orcamento","sql":"CREATE TRIGGER trg_pedido_so_apaga_orcamento\nBEFORE DELETE ON pedido\nFOR EACH ROW\nWHEN OLD.status <> 'orcamento'\nBEGIN\n  SELECT RAISE(ABORT, 'Só é possível excluir pedido em orcamento: o histórico dos demais é mantido');\nEND"}]};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const TX={
pedido:{g:"m",d:`O coração do banco: cada linha é um pedido, que nasce como orçamento e avança até ser entregue.`,c:[

const TT=[["nasce","INSERT em pedido","Todo pedido nasce como orçamento. Criar direto em outro status é bloqueado."],["fluxo","UPDATE do status em pedido","O status só anda uma etapa para frente. Não pula nem volta."],["aprovar","orcamento para aprovado","Antes de aprovar, confere: o pedido tem ao menos 1 item, todo produto tem insumos cadastrados e nenhum insumo usado está com estoque zerado."],["apaga","DELETE em pedido","Só dá para excluir pedido que ainda é orçamento; os demais ficam como histórico."],["itens","INSERT, UPDATE e DELETE em pedido_produto","Os itens só mudam enquanto o pedido é orçamento. São 3 triggers, um para cada operação."]];
const lab=(t,v)=>{const T=DB.t[t],p=T.cols.findIndex(c=>c.pk),i=T.cols.findIndex(c=>c.n=="nome"),r=T.rows.find(r=>r[p]===v);return r&&i>=0?r[i]:""};
function cell(T,i,v){const n=T.cols[i].n,f=T.fks.find(f=>f.f==n);if(v===null)return'<span class="nl">—</span>';
if(f)return`<a href="#${hs(f.t)}">${esc(v)}</a> <span class="lb">${esc(lab(f.t,v))}</span>`;
if(n=="status")return`<span class="st s-${v}">${v}</span>`;if(n=="valor_total")return"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2});return esc(v)}
const grid=(T,rows)=>`<div class="sc"><table class="grid"><thead><tr>${T.cols.map(c=>`<th>${c.n}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((v,i)=>`<td>${cell(T,i,v)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${T.cols.length}" class="nl">Nenhum registro.</td></tr>`}</tbody></table></div>`;
function tv(n){const T=DB.t[n],X=TX[n],fk=Object.fromEntries(T.fks.map(f=>[f.f,f])),used=N.flatMap(m=>DB.t[m].fks.filter(f=>f.t==n).map(f=>[m,f.f]));
return`<div class="g-${X.g}"><div class="th"><h1>${n}</h1><span class="tag">${GR[X.g]}</span><span class="cnt">${T.rows.length} registros</span></div>
<p class="lead">${X.d}</p><h2>Como funciona</h2><ul>${X.c.map(s=>`<li>${s}</li>`).join("")}</ul>
<h2>Colunas</h2><div class="sc"><table class="cols"><thead><tr><th>Coluna</th><th>Tipo</th><th>Marcas</th><th>O que guarda</th></tr></thead><tbody>${T.cols.map(c=>`<tr><td><code>${c.n}</code></td><td><code>${c.t}</code></td><td>${c.pk?'<span class="mk pk">chave primária</span>':""}${fk[c.n]?`<a class="mk fk" href="#${hs(fk[c.n].t)}">→ ${fk[c.n].t}</a>`:""}${c.u?'<span class="mk">único</span>':""}${c.nn&&!c.pk?'<span class="mk">obrigatório</span>':""}</td><td>${X.k[c.n]||(c.pk&&T.cols.filter(x=>x.pk).length==1?"Número único, gerado automaticamente.":"")}</td></tr>`).join("")}</tbody></table></div>
<h2>Ligações</h2><div class="links">${T.fks.map(f=>`<a href="#${hs(f.t)}"><code>${f.f}</code> aponta para <b>${f.t}</b></a>`).join("")}${used.map(([m,c])=>`<a href="#${hs(m)}"><b>${m}</b> aponta para cá por <code>${c}</code></a>`).join("")}${T.fks.length+used.length?"":"<span class=nl>Sem ligações.</span>"}</div>
<h2>Dados de exemplo</h2>${grid(T,T.rows)}</div>`}
const P={cliente:[10,10],funcionario:[10,215],pedido:[250,10],pedido_produto:[550,10],produto:[790,10],tipo_produto:[550,130],fornecedor:[250,270],insumo:[550,270],produto_insumo:[790,170]},WD=n=>n=="pedido"?250:170,HG=n=>28+DB.t[n].cols.length*18+8;
function mapv(){let ln="",bx="";
N.forEach(n=>DB.t[n].fks.forEach(f=>{const a=P[n],b=P[f.t],ia=DB.t[n].cols.findIndex(c=>c.n==f.f),ib=DB.t[f.t].cols.findIndex(c=>c.n==f.to);let d,q;
if(a[0]==b[0]){const x=a[0]+60,y1=a[1],y2=b[1]+HG(f.t);d=`M${x} ${y1}V${y2}`;q=`<text class="q" x="${x+9}" y="${y1-4}">N</text><text class="q" x="${x+9}" y="${y2+12}">1</text>`}
else{const L=a[0]>b[0],x1=L?a[0]:a[0]+WD(n),x2=L?b[0]+WD(f.t):b[0],y1=a[1]+28+ia*18+9,y2=b[1]+28+ib*18+9,s=L?-1:1,dx=(x2-x1)/2;
d=`M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`;q=`<text class="q" x="${x1+s*9}" y="${y1-5}">N</text><text class="q" x="${x2-s*9}" y="${y2-5}">1</text>`}
ln+=`<g><path class="ln" data-a="${n}" data-b="${f.t}" d="${d}"/>${q}</g>`}));
N.forEach(n=>{const w=WD(n),T=DB.t[n];bx+=`<g class="bx g-${TX[n].g}" data-t="${n}" tabindex="0" role="link" aria-label="Abrir ${n}" transform="translate(${P[n]})"><rect class="f" width="${w}" height="${HG(n)}" rx="8"/><path class="h" d="M0 28V8a8 8 0 0 1 8-8H${w-8}a8 8 0 0 1 8 8V28Z"/><rect class="b" width="${w}" height="${HG(n)}" rx="8"/><text class="t" x="10" y="19">${n}</text>${T.cols.map((c,i)=>{const k=(c.pk?"PK ":"")+(T.fks.some(f=>f.f==c.n)?"FK":"");return`<text x="10" y="${28+i*18+13}">${c.n}</text><text class="ty" x="${w-8}" y="${28+i*18+13}">${k.trim()}</text>`}).join("")}</g>`});
const tot=N.reduce((s,n)=>s+DB.t[n].rows.length,0);
return`<h1>Mapa do banco da EMColors</h1><p class="lead">${N.length} tabelas, ${DB.v.length} views e ${DB.tr.length} triggers, com ${tot} registros de exemplo. Clique numa tabela para ler os comentários, as colunas e os dados.</p>
<div class="map"><svg viewBox="0 0 970 400" role="img" aria-label="Diagrama das tabelas e suas ligações">${ln}${bx}</svg></div>
<div class="leg">${Object.keys(GR).map(g=>`<span class="g-${g}"><i class="dot"></i>${GR[g]}</span>`).join("")}<span>PK = chave primária, FK = chave estrangeira. Nas linhas, 1 é o lado “um” e N é o lado “muitos”.</span></div>
<h2>Como ler este banco</h2><ol><li>Um <b>cliente</b> faz vários <b>pedidos</b>. Quem atende e quem aprova cada pedido são <b>funcionários</b>.</li><li>Um pedido tem vários produtos, e um produto aparece em vários pedidos. A tabela <code>pedido_produto</code> faz essa ligação e guarda os metros.</li><li>Cada produto usa vários insumos (<code>produto_insumo</code>). Cada insumo vem de um fornecedor e tem saldo em estoque.</li><li>Triggers protegem o fluxo: o pedido nasce como orçamento, anda uma etapa por vez e só é aprovado se houver estoque. Veja em <a href="#regras">Regras e views</a>.</li></ol>`}
function rv(){const T=DB.t.pedido,si=T.cols.findIndex(c=>c.n=="status"),FL={orcamento:"Itens ainda mudam. Sem valor e sem aprovador.",aprovado:"Valor e aprovador definidos. Estoque conferido.",em_producao:"Itens travados.",pronto:"Aguardando entrega ou retirada.",entregue:"Fim do fluxo. Fica no histórico."};
return`<h1>Regras e views</h1><p class="lead">Aqui estão as regras que o próprio banco aplica (triggers) e as consultas prontas (views).</p>
<h2>O caminho de um pedido</h2><ol class="flow">${Object.keys(FL).map(s=>`<li><b>${s}</b><p>${FL[s]}</p>${T.rows.filter(r=>r[si]==s).map(r=>`<a class="chip" href="#t-pedido">pedido ${r[0]}</a>`).join("")||'<span class="nl">nenhum agora</span>'}</li>`).join("")}</ol>
<p class="note"><b>Dica:</b> o SQLite só confere as chaves estrangeiras quando <code>PRAGMA foreign_keys = ON;</code> está ativo, e isso vale por conexão. O seu arquivo .sql já tem essa linha.</p>
<h2>Regras automáticas (triggers)</h2>${TT.map(([k,w,t])=>{const m=DB.tr.filter(x=>x.name.includes(k));return`<article class="card"><h3>${m.map(x=>x.name).join(", ")}</h3><p class="when">Quando: ${w}</p><p>${t}</p><details><summary>Ver o SQL</summary><pre>${esc(m.map(x=>x.sql).join("\n\n"))}</pre></details></article>`}).join("")}
<h2>Consultas prontas (views)</h2>${DB.v.map(v=>`<article class="card"><h3>${v.name}</h3><p>${VT[v.name]||""}</p>${grid({cols:v.cols.map(n=>({n})),fks:[]},v.rows)}<details><summary>Ver o SQL</summary><pre>${esc(v.sql)}</pre></details></article>`).join("")}`}
$("#nav").innerHTML=`<div class="brand"><span class="reg"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:var(--k)"></i></span>EMColors<small>mapa do banco de dados</small></div><div class="l"><a href="#mapa">Mapa das tabelas</a></div>`+Object.keys(GR).map(g=>`<h3>${GR[g]}</h3><div class="l g-${g}">${N.filter(n=>TX[n].g==g).map(n=>`<a href="#${hs(n)}"><i class="dot"></i>${n}<span class="n">${DB.t[n].rows.length}</span></a>`).join("")}</div>`).join("")+`<h3>Para entender as regras</h3><div class="l"><a href="#regras">Regras e views</a></div>`;
function go(){const h=location.hash.slice(1)||"mapa";$("#main").innerHTML=h=="regras"?rv():h.startsWith("t-")&&DB.t[un(h)]?tv(un(h)):mapv();document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")=="#"+h));window.scrollTo(0,0)}
function hot(n){const s=$(".map svg");if(!s)return;n?s.dataset.hot=n:delete s.dataset.hot;s.querySelectorAll(".ln").forEach(l=>l.classList.toggle("hl",!!n&&(l.dataset.a==n||l.dataset.b==n)))}
const M=$("#main");M.addEventListener("mouseover",e=>hot(e.target.closest(".bx")?.dataset.t));
M.addEventListener("click",e=>{const b=e.target.closest(".bx");if(b)location.hash=hs(b.dataset.t)});
M.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList.contains("bx"))location.hash=hs(e.target.dataset.t)});
M.addEventListener("focusin",e=>hot(e.target.closest?.(".bx")?.dataset.t));
addEventListener("hashchange",go);go();
</script>
